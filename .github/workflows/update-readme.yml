name: Update profile README

# Keeps the profile up to date without manual edits: rebuilds the project tables,
# latest activity and stats card from live GitHub data. A commit is made only
# when something actually changed.
on:
  schedule:
    - cron: "30 1 * * *"      # every day at 07:00 India time
  workflow_dispatch:           # "Run workflow" button on the Actions tab
  push:
    branches: [main]
    paths: ["scripts/**", ".github/workflows/**"]

permissions:
  contents: write

concurrency:
  group: update-readme
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Refresh projects, activity and stats
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/update_readme.py

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md assets
          if git diff --cached --quiet; then
            echo "Nothing to update."
          else
            git commit -m "Refresh profile README"
            git push
          fi
