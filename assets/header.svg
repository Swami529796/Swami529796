<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 230" width="100%" role="img" aria-labelledby="title desc">
  <title id="title">Swaminathan Narayanan</title>
  <desc id="desc">Data Analytics Professional. Excel and VBA automation, Python, SQL and Power BI. Turning manual reports into one click.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#12324f"/>
      <stop offset="1" stop-color="#1f6f8b"/>
    </linearGradient>
    <style>
      .name { font: 700 44px "Segoe UI", Helvetica, Arial, sans-serif; fill: #ffffff; }
      .hello { font: 400 20px "Segoe UI", Helvetica, Arial, sans-serif; fill: #bcd6ea; }
      .tag { font: 600 23px "Segoe UI", Helvetica, Arial, sans-serif; fill: #ffd166; opacity: 0; animation: cycle 16s infinite; }
      .t2 { animation-delay: 4s; }
      .t3 { animation-delay: 8s; }
      .t4 { animation-delay: 12s; }
      @keyframes cycle {
        0%   { opacity: 0; transform: translateY(8px); }
        3%   { opacity: 1; transform: translateY(0); }
        22%  { opacity: 1; transform: translateY(0); }
        25%  { opacity: 0; transform: translateY(-8px); }
        100% { opacity: 0; }
      }
      .bar { fill: #ffffff; opacity: 0.85; transform-box: fill-box; transform-origin: bottom; animation: grow 8s ease-in-out infinite; }
      .b2 { animation-delay: 0.25s; } .b3 { animation-delay: 0.5s; } .b4 { animation-delay: 0.75s; }
      .b5 { animation-delay: 1s; }    .b6 { animation-delay: 1.25s; }
      .last { fill: #ffd166; opacity: 1; }
      @keyframes grow {
        0%, 4%    { transform: scaleY(0.05); }
        22%, 88%  { transform: scaleY(1); }
        100%      { transform: scaleY(0.05); }
      }
      .trend { fill: none; stroke: #ffd166; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round;
               stroke-dasharray: 330; stroke-dashoffset: 330; animation: draw 8s ease-in-out infinite; }
      @keyframes draw {
        0%, 20%   { stroke-dashoffset: 330; }
        45%, 88%  { stroke-dashoffset: 0; }
        100%      { stroke-dashoffset: 330; }
      }
      .dot { fill: #ffd166; opacity: 0; animation: pop 8s infinite; }
      @keyframes pop { 0%, 44% { opacity: 0; } 48%, 88% { opacity: 1; } 100% { opacity: 0; } }
      .axis { stroke: #ffffff; stroke-opacity: 0.35; stroke-width: 1.5; }
      @media (prefers-reduced-motion: reduce) {
        .tag, .bar, .trend, .dot { animation: none; }
        .t1 { opacity: 1; } .bar { transform: none; } .trend { stroke-dashoffset: 0; } .dot { opacity: 1; }
      }
    </style>
  </defs>

  <rect width="1000" height="230" rx="18" fill="url(#bg)"/>

  <text x="48" y="74" class="hello">Hi, I'm</text>
  <text x="46" y="124" class="name">Swaminathan Narayanan</text>
  <text x="48" y="172" class="tag t1">Data Analytics Professional</text>
  <text x="48" y="172" class="tag t2">Excel &amp; VBA Automation</text>
  <text x="48" y="172" class="tag t3">Python  |  SQL  |  Power BI</text>
  <text x="48" y="172" class="tag t4">Turning manual reports into one click</text>

  <!-- animated chart: bars grow, then the trend line draws itself -->
  <g transform="translate(660 40)">
    <line class="axis" x1="0" y1="150" x2="290" y2="150"/>
    <rect class="bar"         x="10"  y="105" width="30" height="45" rx="3"/>
    <rect class="bar b2"      x="56"  y="90"  width="30" height="60" rx="3"/>
    <rect class="bar b3"      x="102" y="98"  width="30" height="52" rx="3"/>
    <rect class="bar b4"      x="148" y="68"  width="30" height="82" rx="3"/>
    <rect class="bar b5"      x="194" y="50"  width="30" height="100" rx="3"/>
    <rect class="bar b6 last" x="240" y="24"  width="30" height="126" rx="3"/>
    <polyline class="trend" points="25,92 71,77 117,85 163,55 209,37 255,10"/>
    <circle class="dot" cx="255" cy="10" r="5"/>
  </g>
</svg>
